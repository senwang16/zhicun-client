name: CI

on:
  push:
    branches: [main]
  pull_request:

# The public repository contains the Android client only; the official gateway is private.
# No secrets are configured for this workflow on purpose: open-source builds must never
# receive an official gateway URL or token. The app degrades to "cloud AI not configured".
permissions:
  contents: read

jobs:
  android:
    name: Android build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The runner image already ships an Android SDK and sdkmanager. We deliberately do not
      # use android-actions/setup-android here: recent versions call `sdkmanager tools`, which
      # no longer exists in current command-line tools, and the action fails before our steps.
      - name: Install platform 36 and build-tools
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "Using SDK at $SDK_ROOT"
          echo "sdk.dir=$SDK_ROOT" > android/local.properties
          SDKMGR="$(command -v sdkmanager || echo "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-36" "build-tools;36.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/gradle/libs.versions.toml') }}
          restore-keys: gradle-

      - name: Check bilingual resources
        run: python3 scripts/release/check-i18n-res.py android

      - name: Compile and test
        working-directory: android
        run: |
          set -uo pipefail
          chmod +x gradlew
          # Plugin resolution occasionally fails on hosted runners (Maven Central/Plugin Portal
          # hiccups). A short retry loop keeps the signal without turning a blip into a red build.
          for attempt in 1 2 3; do
            echo "::group::Attempt $attempt"
            if ./gradlew --no-daemon :app:compileDebugKotlin :app:testDebugUnitTest; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "Attempt $attempt failed; retrying in 15s"
            sleep 15
          done
          exit 1

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: android/app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore