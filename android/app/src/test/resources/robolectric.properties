# Robolectric 沙箱配置
#
# 为什么固定 sdk=34 而不是跟随 targetSdk(36)：
#   Robolectric 4.17 的 API 35/36 沙箱强制要求运行在 JDK 21 上（报错示例：
#   "Android SDK 36 requires Java 21 (have Java 17)"）。
#   而本机改用 JDK 21 会触发 Gradle 测试工作进程的 argfile 编码问题 ——
#   工程路径含中文（F:\project\智存），JDK 21 默认 file.encoding=UTF-8，JVM 启动器却按
#   平台编码(GBK)读取 @argfile 里传递的类路径，导致全部测试 ClassNotFoundException。
#   详见 gradle.properties 中关于 -Dfile.encoding 的说明。
#
# 影响面：仅在 JVM 上执行 Room/SQLite 相关集成测试，API 34 与 36 的 SQLite 语义一致；
#   真机/模拟器上的行为验证仍以 targetSdk 36 为准（见 DEVELOPMENT_PLAN.md 附录 C）。
#   若将来把工程迁到纯 ASCII 路径，可把此处改为 sdk=36 并将构建 JDK 升到 21。
sdk=34
