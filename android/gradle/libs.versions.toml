# Version Catalog — 智存 App 全局依赖版本声明
#
# 说明：
# - M1 阶段仅「声明」全部核心依赖版本（见 DEVELOPMENT_PLAN.md M1 验收标准）；
#   真正被 app 模块消费的库见 app/build.gradle.kts，其余留待 M2/M6/M8/M11 启用。
# - KSP 版本必须与 Kotlin 版本严格对应（<kotlin>-<ksp>）。
#
# ⚠️ 版本天花板规则（2026-10 实测，务必遵守）
#   本项目固定 compileSdk = 36 / AGP 8.13.2，因此所有 AndroidX 与第三方 AAR 的
#   `META-INF/.../aar-metadata.properties` 必须满足 minCompileSdk ≤ 36 且 minAgp ≤ 8.13.2。
#   2026 年下半年起，最新版 AndroidX（core 1.19、compose 1.12、lifecycle 2.11、coil 3.6）
#   与 Hilt 2.59+ 已要求 compileSdk 37 / AGP 9.1+，**升级前必须先核对 aar-metadata**，
#   否则构建会直接失败。已核验的本代上限见各条目注释。

[versions]
# Android SDK 版本（2026-10-22 审核 #5 整改：与库版本一样集中在此，build.gradle.kts 只引用）。
# compileSdk 36 是天花板，见文件头部「版本天花板规则」。
compileSdk = "36"
minSdk = "26"
targetSdk = "36"

# 世代一致性：AGP 8.13.x 仅与 Gradle 8.x 兼容（Gradle 9 移除了 AGP 8 依赖的 API），
# wrapper 固定 gradle-8.14.3。AGP 9.x 默认开启 newDsl / builtInKotlin，与 KGP + KSP
# 链路不兼容，官方绕行开关已标记废弃（AGP 10 移除）——迁移事项见 DEVELOPMENT_PLAN.md M1 完成说明。
agp = "8.13.2"
kotlin = "2.2.21"
ksp = "2.2.21-2.0.5"

# DI（Hilt 2.59+ 的 Gradle 插件强制要求 AGP 9.0+，故锁定 2.58）
hilt = "2.58"
hiltNavigationCompose = "1.3.0"   # 1.4.0 要求 AGP 9.1+

# Compose（BOM 2026.06.01 → ui 1.11.4 / material3 1.4.0；2026.08.00 起为 1.12，要求 AGP 9.1）
composeBom = "2026.06.01"

# AndroidX 基础（上限：core-ktx 1.19 起要求 SDK 37；lifecycle 2.11 起要求 SDK 37）
coreKtx = "1.18.0"
# core-splashscreen 1.0.1（2023 稳定线）：aar-metadata 实测 minCompileSdk=31，低于本工程 36；
# 1.2.0 起要求 compileSdk 35（仍满足），但 1.0.1 已覆盖全部所需 API，不追新
coreSplashscreen = "1.0.1"
lifecycle = "2.10.0"
activityCompose = "1.11.0"
navigationCompose = "2.9.8"

# 数据与后台（M2/M6 启用；两者均仍兼容 SDK 36）
room = "2.8.5"
# work 2.11.2：aar-metadata 实测 minCompileSdk=35 / minAgp=8.6.0，本工程 36 / 8.13.2 满足
work = "2.11.2"
# androidx.hilt（hilt-work / hilt-compiler）：1.3.0 实测 minCompileSdk=34，与 hilt-navigation-compose 同版本线
androidxHilt = "1.3.0"

# 图片加载（M3 启用；3.6.x 起要求 SDK 37，最高可用 3.5.0）
coil = "3.5.0"

# OCR（M7 启用，T-005 已决策用「捆绑模型」方案）
# 16.0.1 为 2024-08 的稳定版，依赖 play-services-base 18.5.0 / mlkit common 18.11.0，
# 均远早于 compileSdk 37 的要求，无需担心 aar-metadata 天花板。
# 代价：捆绑中文模型使 APK 增大约 16MB（首次使用无需下载模型，离线可用）。
mlkitTextRecognition = "16.0.1"

# 网络与序列化（M8/M11 启用）
okhttp = "4.12.0"
retrofit = "2.12.0"
kotlinxSerialization = "1.9.0"
# HTML 解析（M8 网页正文提取）。1.23.2 实测为 Java 8 字节码（major 52），
# 只用到 java.nio.file / java.time / java.util.stream —— 均在 minSdk 26 范围内，无需 desugar 额外配置。
jsoup = "1.23.2"

# 日历视图（M19 收件箱按日期筛选弹层；MIT，纯 Compose 组件，无网络/存储能力）。
# 用 Android 专用产物 compose（java.time）而不是 compose-multiplatform（kotlinx-datetime）：
# 后者会把 kotlinx-datetime 类型漏进调用方，破坏"弹层边界外只见 java.time"的防锁定约定。
# 仅 InboxCalendarSheet.kt 一个文件允许 import 其类型（M19 防锁定边界）。
calendarCompose = "2.10.1"

# 测试
junit = "4.13.2"
coroutines = "1.10.2"
turbine = "1.2.1"
# Robolectric：本机无真机/模拟器，Room in-memory 集成测试在 JVM 上跑（4.17 已支持 API 36）
robolectric = "4.17"

[libraries]
# --- AndroidX 基础 ---
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
# 系统级开屏（附录 T）：兼容库让 API 26-30 与 31+ 走同一套 SplashScreen 主题
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "coreSplashscreen" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
# collectAsStateWithLifecycle 所在 artifact（AGENTS.md §2.2 禁止无 Lifecycle 的 collectAsState）
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }

# --- Compose（版本由 BOM 统一管理）---
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
# Compose UI 测试（版本由 BOM 管理）。智存不做图标字体/图标库依赖，避免额外的 material-icons 体积
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }

# --- Hilt ---
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
androidx-hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

# --- Room（M2）---
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }

# --- WorkManager（M6）---
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
# @HiltWorker 支持：hilt-work 提供 HiltWorkerFactory，hilt-compiler 生成注入代码
androidx-hilt-work = { module = "androidx.hilt:hilt-work", version.ref = "androidxHilt" }
androidx-hilt-compiler = { module = "androidx.hilt:hilt-compiler", version.ref = "androidxHilt" }

# --- Coil 3（M3）---
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }

# --- ML Kit OCR（M7）---
# 中文识别（含英文）：捆绑模型版，离线可用
mlkit-text-recognition-chinese = { module = "com.google.mlkit:text-recognition-chinese", version.ref = "mlkitTextRecognition" }

# --- 网络与序列化（M8/M11）---
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging-interceptor = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-converter-kotlinx-serialization = { module = "com.squareup.retrofit2:converter-kotlinx-serialization", version.ref = "retrofit" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }

# --- 日历（M19 收件箱日期筛选；Android 专用产物，java.time API）---
calendar-compose = { module = "com.kizitonwose.calendar:compose", version.ref = "calendarCompose" }

# --- 测试 ---
junit = { module = "junit:junit", version.ref = "junit" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
# WorkManager 测试（TestListenableWorkerBuilder / WorkManagerTestInitHelper）
androidx-work-testing = { module = "androidx.work:work-testing", version.ref = "work" }
# 本地 HTTP 服务端（M8 验证真实请求/重定向/大小上限，不打外网）
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
