# JVM 参数：KSP + Hilt 注解处理需要较大的堆
# ⚠️ 编码必须钉死为 GBK（2026-10-24 r4 审查 M-1，已实验证实）：
#    Gradle 用 argfile（@file）传递测试工作进程的类路径，JVM 启动器在中文 Windows 上
#    按平台编码（GBK）读取 argfile。JDK 18+ 的 file.encoding 默认是 UTF-8 —— daemon
#    用 UTF-8 写、启动器用 GBK 读，工程路径里的"智存"就被解码错，testDebugUnitTest
#    全部 ClassNotFoundException（assembleDebug 不受影响，极具迷惑性）。
#    显式加 -Dfile.encoding=GBK 后两边一致；本目录（JDK 21）实测 114 套件全绿。
#    彻底解法是把工程迁到纯 ASCII 路径，届时本行可撤。
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=GBK
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# AndroidX 与命名空间
android.useAndroidX=true
android.nonTransitiveRClass=true

# 工程路径含中文（F:\project\智存），AGP 默认会拒绝构建并提示"non-ASCII characters"。
# 此处显式关闭该检查；已实测 assembleDebug / testDebugUnitTest 通过（见 DEVELOPMENT_PLAN.md M1 完成说明）。
# 切换到纯 ASCII 路径后可删除本行。
android.overridePathCheck=true

# Kotlin 编译走进程内执行，禁用 Kotlin compile daemon。
# 本机 Kotlin daemon 无法在 %LOCALAPPDATA%\kotlin\daemon 写入 marker 文件
# （java.nio.file.AccessDeniedException → "Could not connect to Kotlin compile daemon"），
# 反复重试也无法恢复。进程内编译略慢（无增量 daemon），但稳定可用。
kotlin.compiler.execution.strategy=in-process

# Kotlin
kotlin.code.style=official
